apiVersion: v1
kind: ConfigMap
metadata:
  name: notrouble-config
  namespace: notrouble
data:
  NODE_ENV: "production"
  PORT: "5000"
  DB_HOST: "mysql-service"
  DB_PORT: "3306"
  DB_NAME: "resonova_db"
  DB_USER: "root"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  JWT_EXPIRES_IN: "15m"
  REFRESH_TOKEN_EXPIRES_DAYS: "7"
