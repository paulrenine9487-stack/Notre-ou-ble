<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 58 58" width="58" height="58" fill="none">
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="loginBtnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>

  <!-- Circular Button Background (58x58) -->
  <circle cx="29" cy="29" r="27.5" fill="url(#loginBtnGrad)" />

  <!-- White Login Symbol: Person + Door + Entering Arrow -->
  <!-- 1. Person on Left -->
  <!-- Head -->
  <circle cx="17.5" cy="18" r="4.5" fill="#FFFFFF" />

  <!-- Body / Torso & Walking Legs -->
  <path
    d="M 12 30.5 C 12 25.5 14.5 24 17.5 24 C 20.5 24 23 25.5 23 30.5 C 23 33.5 21.8 36.5 20.2 38.5 L 21.5 45.5 C 21.6 46.2 21 47 20.2 47 C 19.6 47 19.1 46.5 19 45.8 L 17.8 41.2 L 16.5 45.8 C 16.4 46.5 15.9 47 15.3 47 C 14.5 47 13.9 46.2 14 45.5 L 15 38.8 C 13.2 36.8 12 33.8 12 30.5 Z"
    fill="#FFFFFF"
  />

  <!-- 2. Entering Arrow (Moving into Doorway) -->
  <path
    d="M 21.5 29.5 H 34"
    stroke="#FFFFFF"
    stroke-width="2.8"
    stroke-linecap="round"
  />
  <path
    d="M 29.5 25 L 34 29.5 L 29.5 34"
    stroke="#FFFFFF"
    stroke-width="2.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- 3. Doorframe on Right -->
  <path
    d="M 31 14.5 H 41 C 42.4 14.5 43.5 15.6 43.5 17 V 41 C 43.5 42.4 42.4 43.5 41 43.5 H 31"
    stroke="#FFFFFF"
    stroke-width="2.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
