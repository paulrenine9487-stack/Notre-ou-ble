<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="accPurpleGradient" gradientUnits="userSpaceOnUse" x1="15" y1="15" x2="85" y2="85">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#5B21B6" />
    </linearGradient>
  </defs>

  <!-- Exactly ONE continuous circular outline -->
  <circle
    cx="50"
    cy="50"
    r="44"
    stroke="url(#accPurpleGradient)"
    stroke-width="6"
    fill="none"
  />

  <!-- Circular Head -->
  <circle
    cx="50"
    cy="26"
    r="7.5"
    fill="url(#accPurpleGradient)"
  />

  <!-- Complete Accessibility Person: Outstretched Arms, Central Torso & Legs -->
  <path
    d="M 22 41.5 H 78 M 50 41.5 V 56.5 L 35 77 M 50 56.5 L 65 77"
    stroke="url(#accPurpleGradient)"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
