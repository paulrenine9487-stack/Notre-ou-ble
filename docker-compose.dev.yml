version: '3.8'

# Development Docker Compose Stack with Live Code Mounting & Hot Reloading
services:
  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resonova-backend-dev
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DB_HOST=mysql-dev
      - DB_USER=root
      - DB_PASSWORD=devpassword
      - DB_NAME=resonova_db
      - REDIS_HOST=redis-dev
      - REDIS_PORT=6379
      - JWT_SECRET=resonova_dev_secret_key_12345
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - mysql-dev
      - redis-dev
    command: ["npm", "run", "dev"]

  redis-dev:
    image: redis:7-alpine
    container_name: resonova-redis-dev
    ports:
      - "6379:6379"

  mysql-dev:
    image: mysql:8.0
    container_name: resonova-mysql-dev
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: devpassword
      MYSQL_DATABASE: resonova_db
    volumes:
      - mysql_dev_data:/var/lib/mysql

volumes:
  mysql_dev_data:
