# No Tre(ou)ble Portal - Production Nginx Configuration
# High-Performance Reverse Proxy, Load Balancer & Security Layer

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Hide Nginx server version banner (OWASP Security Best Practice)
    server_tokens off;

    # Performance optimizations
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Request Body Size Limitation (50MB for student song recordings / CMS media)
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # Logging format with request ID, latency, and upstream response time
    log_format  main_custom  '$remote_addr - $remote_user [$time_local] "$request" '
                             '$status $body_bytes_sent "$http_referer" '
                             '"$http_user_agent" "$http_x_forwarded_for" '
                             'req_id="$http_x_request_id" '
                             'rt=$request_time uct="$upstream_connect_time" '
                             'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main_custom;

    # Gzip Compression
    gzip  on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        font/ttf
        font/opentype
        image/svg+xml;

    # Upstream backend cluster definition for Horizontal Load Balancing
    upstream backend_cluster {
        least_conn; # Least-connections load distribution
        
        # Primary container instances
        server backend:5000 max_fails=3 fail_timeout=10s;
        server backend-2:5000 max_fails=3 fail_timeout=10s backup;
        
        keepalive 64;
    }

    # Include site configurations
    include /etc/nginx/conf.d/*.conf;
}
